name: Feature request
description: Suggest a widget, API or platform capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: The use case first; the API you have in mind second.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
